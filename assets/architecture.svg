<svg width="1100" height="360" viewBox="0 0 1100 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Solution Architecture</title>
  <desc id="desc">Azure Logic App monitors Intune admin tasks and posts new items into Microsoft Teams.</desc>
  <rect width="1100" height="360" rx="24" fill="#0f172a"/>
  <rect x="28" y="28" width="1044" height="304" rx="18" fill="#111827" stroke="#334155"/>
  <text x="60" y="82" font-family="Segoe UI, Arial" font-size="34" font-weight="700" fill="#f8fafc">Solution Architecture</text>
  <text x="60" y="118" font-family="Segoe UI, Arial" font-size="19" fill="#cbd5e1">Azure Logic App monitors Intune admin tasks and posts new items into Microsoft Teams.</text>
  <text x="60" y="155" font-family="Segoe UI, Arial" font-size="18" fill="#e5e7eb">- Logic App queries Microsoft Graph on a schedule</text><text x="60" y="189" font-family="Segoe UI, Arial" font-size="18" fill="#e5e7eb">- Storage tracks known task IDs</text><text x="60" y="223" font-family="Segoe UI, Arial" font-size="18" fill="#e5e7eb">- Teams receives notifications for newly detected tasks</text>
</svg>
